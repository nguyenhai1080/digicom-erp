name: dgc-finance-dev
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dgc_dev
      POSTGRES_PASSWORD: dgc_local_only
      POSTGRES_DB: dgc_finance_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dgc_pg_data:/var/lib/postgresql/data
volumes:
  dgc_pg_data:
